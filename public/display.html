<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投影画面 | 早押し・ボードクイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">📽 投影画面</div>
  <div style="display:flex; align-items:center; gap:.6em;">
    <button class="secondary" id="btn-open-settings" style="padding:.4em .7em; font-size:1.1rem;" title="早押し機の設定">⚙</button>
    <div class="room-tag" id="room-tag">-</div>
  </div>
</div>

<div id="settings-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-card" style="max-width:560px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.8em;">
      <h3 style="margin:0;">早押し機の設定</h3>
      <button class="secondary" id="btn-close-settings" style="padding:.3em .8em;">閉じる</button>
    </div>

    <div class="hint" id="arduino-support-warning" style="display:none; margin-bottom:.8em;">
      このブラウザ・端末はWeb Serial API未対応のため、早押し機との接続機能は使えません
      （パソコン版のChromeまたはEdgeのみ対応。投影画面そのものは通常どおり使えます）。
    </div>

    <div style="display:flex; align-items:center; gap:.6em; flex-wrap:wrap;">
      <button class="secondary" id="btn-arduino-connect">接続する</button>
      <button class="danger" id="btn-arduino-disconnect">切断</button>
      <span class="hint" id="arduino-status">未接続</span>
    </div>

    <div style="margin-top:1.2em; padding-top:1em; border-top:1px solid var(--line);">
      <h4 style="margin:0 0 .4em;">ボタンの割り当て（機種を問わず使えます）</h4>
      <p class="hint">お使いの早押し機がどんな文字列を送ってくるか分からなくても構いません。
        下で割り当てたい参加者を選んで「学習開始」を押し、その人が使う実物のボタンを
        押してください。受信した内容がそのまま自動で登録されます。</p>

      <div style="display:flex; gap:.6em; align-items:end; flex-wrap:wrap; margin-top:.8em;">
        <div class="field" style="margin:0;">
          <label>参加者</label>
          <select id="learn-player-select" style="min-width:10em;"></select>
        </div>
        <button class="gold" id="btn-start-learn">学習開始</button>
        <button class="secondary" id="btn-cancel-learn" style="display:none;">キャンセル</button>
      </div>
      <div class="hint" id="learn-status" style="margin-top:.6em;"></div>

      <div id="signal-map-list" style="margin-top:1em;"></div>
      <div class="hint" id="unmapped-signal-status" style="margin-top:.8em; color:var(--gold);"></div>
    </div>
  </div>
</div>

<div id="timer-display" style="text-align:center; font-size:3rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--gold); min-height:1.2em; margin-top:.6em;"></div>

<div class="display-stage" id="stage">
  <div class="hint" style="text-align:center;">読み込み中…</div>
</div>

<div id="question-panel" class="question-panel" style="display:none;">
  <div class="question-panel-no" id="qp-no"></div>
  <div class="question-panel-question" id="qp-question"></div>
  <div class="question-panel-answer" id="qp-answer"></div>
  <div class="question-panel-comment" id="qp-comment"></div>
  <div class="question-panel-author" id="qp-author"></div>
</div>

<div id="reveal-overlay-layer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/board-sync.js"></script>
<script src="js/timer-sync.js"></script>
<script src="js/question-text.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const roomName = params.get('room');
document.getElementById('room-tag').textContent = roomName || '-';

if (!roomName) {
  document.getElementById('stage').innerHTML = '<div class="error-msg">部屋名が指定されていません。URLに ?room=部屋名 を付けてください。</div>';
  throw new Error('missing room');
}

const socket = io();
let latestState = null;

// 表示画面は「観客」として部屋に入る（判定者・回答者どちらでもない特別な参加）
socket.on('connect', () => {
  socket.emit('spectate_room', { roomName }, (res) => {
    if (res && res.error) {
      document.getElementById('stage').innerHTML = `<div class="error-msg">${res.error}</div>`;
    }
  });
});

socket.on('room_state', render);
socket.on('draw_stroke', (data) => {
  BoardSync.stroke(data.playerId, data);
  refreshLiveCanvas(data.playerId);
});
socket.on('clear_canvas', ({ playerId }) => {
  BoardSync.clear(playerId);
  refreshLiveCanvas(playerId);
});
socket.on('reset_canvases', () => {
  if (latestState) latestState.players.forEach(p => BoardSync.clear(p.id));
});

// 判定者が「正誤判定を確定する」を押した瞬間に一斉に届くイベント。
// 対象になった回答者のタイル位置に、正解=緑/不正解=赤の演出と点数を
// 一時的なオーバーレイとして重ねて表示する（グリッドの再描画とは独立させて
// いるので、この直後に room_state が届いてタイルが作り直されても演出は消えない）。
socket.on('score_confirmed', ({ results }) => {
  (results || []).forEach((r) => playScoreRevealEffect(r));
});

function playScoreRevealEffect(result) {
  const canvasWrap = document.querySelector(`.display-tile-canvas[data-player-id="${result.playerId}"]`)
    || document.querySelector(`.canvas-wrap[data-player-id="${result.playerId}"]`);
  const targetEl = canvasWrap ? (canvasWrap.closest('.display-tile') || canvasWrap.closest('.display-single') || canvasWrap) : null;
  if (!targetEl) return;

  const rect = targetEl.getBoundingClientRect();
  const layer = document.getElementById('reveal-overlay-layer');

  const flash = document.createElement('div');
  flash.className = 'reveal-flash ' + (result.correct ? 'reveal-correct' : 'reveal-incorrect');
  flash.style.left = `${rect.left}px`;
  flash.style.top = `${rect.top}px`;
  flash.style.width = `${rect.width}px`;
  flash.style.height = `${rect.height}px`;

  const badge = document.createElement('div');
  badge.className = 'reveal-badge';
  const sign = result.points > 0 ? '+' : '';
  badge.innerHTML = `<div class="reveal-mark">${result.correct ? '○' : '×'}</div><div class="reveal-points">${sign}${result.points}点</div>`;
  flash.appendChild(badge);

  layer.appendChild(flash);
  setTimeout(() => flash.remove(), 1800);
}

// 早押しで押した順位(1着=1, 2着=2, ...押していなければ0)に対して、
// 判定者が設定した演出('flash'=点滅 / 'light'=点灯 / 'none'=なし)を割り当てる
function getBuzzEffectClass(state, playerId) {
  const idx = (state.buzzOrder || []).findIndex((b) => b.playerId === playerId);
  if (idx < 0) return null;
  const rank = idx + 1;
  const cfg = state.buzzEffect || { first: 'flash', others: 'light' };
  const effect = rank === 1 ? cfg.first : cfg.others;
  if (effect === 'flash') return 'buzz-flash';
  if (effect === 'light') return 'buzz-light';
  return null;
}

// 判定者が「公開」にするまでは、シンキングタイム中の他人の解答が見えないよう
// 投影画面には内容を出さず、代わりにプレースホルダーを表示する。
function fillBoardContent(container, state, p) {
  container.innerHTML = '';
  if (!p.revealed) {
    container.classList.add('board-hidden');
    container.innerHTML = '<div class="hidden-placeholder">🙈<br>非公開</div>';
    return;
  }
  container.classList.remove('board-hidden');
  if (p.imageData) {
    const img = document.createElement('img');
    img.src = p.imageData;
    container.appendChild(img);
  } else {
    const c = BoardSync.getCanvas(p.id);
    c.style.width = '100%';
    c.style.height = '100%';
    container.appendChild(c);
  }
}

function render(state) {
  if (!state || state.roomName !== roomName) return;
  latestState = state;
  renderTimer(state.timer);
  renderQuestionPanel(state.questionPanel);
  renderSignalMapList(state.buzzerSignalMap, state.players);
  renderLearnStatus(state.pendingLearnTarget, state.players);
  renderLearnPlayerSelect(state.players);

  const stage = document.getElementById('stage');
  if (state.display.mode === 'single' && state.display.selectedPlayerId) {
    const p = state.players.find(pl => pl.id === state.display.selectedPlayerId);
    if (!p) { renderGrid(state); return; }
    stage.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'display-single';

    const boardHolder = document.createElement('div');
    boardHolder.className = 'canvas-wrap';
    boardHolder.dataset.playerId = p.id;
    const effectClass = getBuzzEffectClass(state, p.id);
    if (effectClass) boardHolder.classList.add(effectClass);
    fillBoardContent(boardHolder, state, p);
    if (p.revealed && !p.imageData) {
      const c = boardHolder.querySelector('canvas');
      if (c) c.style.height = 'auto';
    }
    wrap.appendChild(boardHolder);

    const nameTag = document.createElement('div');
    nameTag.className = 'name-tag';
    nameTag.textContent = p.name;
    wrap.appendChild(nameTag);

    const scoreTag = document.createElement('div');
    scoreTag.style.cssText = 'font-size:1.4rem; font-weight:900; color:var(--gold);';
    scoreTag.textContent = `${p.score || 0} 点`;
    wrap.appendChild(scoreTag);

    stage.innerHTML = '';
    stage.appendChild(wrap);
  } else {
    renderGrid(state);
  }
}

// 参加人数に応じて、投影画面の一覧表示のマス目（列数）を決める。
// 人数が少ないほど1人あたりの表示が大きくなるようにする。
function computeGridColumns(n) {
  if (n <= 1) return 1;
  if (n === 3) return 3;   // 3人はあえて1列（2x2で1マス余らせない）
  if (n <= 4) return 2;    // 2人は横並び、4人は2x2
  if (n <= 9) return 3;
  if (n <= 16) return 4;
  return Math.ceil(Math.sqrt(n));
}

function renderGrid(state) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'display-grid';

  const count = state.players.length || 1;
  const cols = computeGridColumns(count);
  const rows = Math.max(1, Math.ceil(count / cols));
  // minmax(0, 1fr) にしないと、素の 1fr は「中身の最小サイズ」までしか
  // 縮まらないため、画像が入った瞬間にグリッドがはみ出してスクロールが
  // 必要になってしまう（プレースホルダーの文字だけなら小さいため気づきにくい）。
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;

  state.players.forEach((p) => {
    const tile = document.createElement('div');
    tile.className = 'display-tile' + (p.correct === true ? ' correct' : p.correct === false ? ' incorrect' : '');
    const effectClass = getBuzzEffectClass(state, p.id);
    if (effectClass) tile.classList.add(effectClass);

    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'display-tile-canvas';
    canvasWrap.dataset.playerId = p.id;
    fillBoardContent(canvasWrap, state, p);

    const foot = document.createElement('div');
    foot.className = 'tile-head tile-foot';
    foot.innerHTML = `<span>${escapeHtml(p.name)}</span><span style="color:var(--gold); font-weight:900;">${p.score || 0}点</span>`;
    tile.appendChild(canvasWrap);
    tile.appendChild(foot);
    grid.appendChild(tile);
  });
  stage.appendChild(grid);
}

function refreshLiveCanvas(playerId) {
  if (!latestState) return;
  const p = latestState.players.find(pl => pl.id === playerId);
  if (!p || p.imageData || !p.revealed) return; // 非公開中は更新しない
  const wrap = document.querySelector(`.display-tile-canvas[data-player-id="${playerId}"]`) ||
               (latestState.display.mode === 'single' && latestState.display.selectedPlayerId === playerId
                 ? document.querySelector('.display-single .canvas-wrap') : null);
  if (!wrap) return;
  if (!wrap.querySelector('canvas')) {
    wrap.innerHTML = '';
    const c = BoardSync.getCanvas(playerId);
    c.style.width = '100%';
    c.style.height = '100%';
    wrap.appendChild(c);
  }
}

function renderTimer(timer) {
  const el = document.getElementById('timer-display');
  if (!timer || !timer.endsAt) {
    TimerSync.stop();
    el.textContent = '';
    return;
  }
  TimerSync.start(timer.endsAt, (sec) => {
    el.textContent = TimerSync.format(sec);
  });
}

// 問題文・解答パネル。判定者が「SEND」した時だけ表示する
// （非公開の間は questionPanel.current 自体がサーバーから送られてこない）。
function renderQuestionPanel(questionPanel) {
  const panel = document.getElementById('question-panel');
  if (!questionPanel || !questionPanel.visible || !questionPanel.current) {
    panel.style.display = 'none';
    return;
  }
  const q = questionPanel.current;
  document.getElementById('qp-no').textContent = q.no ? `問題 ${q.no}` : '';
  document.getElementById('qp-question').innerHTML = renderSplitQuestionHTML(q.question || '', escapeHtml);
  document.getElementById('qp-answer').textContent = q.answer ? `解答: ${q.answer}` : '';
  document.getElementById('qp-comment').textContent = q.comment || '';
  document.getElementById('qp-author').textContent = q.author ? `出題: ${q.author}` : '';
  panel.style.display = 'flex';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// --- 設定モーダルの開閉 ---
document.getElementById('btn-open-settings').onclick = () => {
  document.getElementById('settings-overlay').style.display = 'flex';
};
document.getElementById('btn-close-settings').onclick = () => {
  document.getElementById('settings-overlay').style.display = 'none';
};

// --- Arduino早押し機との接続 (Web Serial API) ---
// このAPIはPC版Chrome/Edgeでのみ動作し、かつ「セキュアコンテキスト」
// （https:// のページ、または http://localhost）でのみ使用できます。
// ローカルネットワークで http://<IPアドレス>:3000 のように開いている場合は
// 動作しないため、投影PC自身では http://localhost:3000/... で開いてください。
let serialPort = null;
let serialReader = null;
let serialLineBuffer = '';

if (!('serial' in navigator)) {
  document.getElementById('arduino-support-warning').style.display = 'block';
  document.getElementById('btn-arduino-connect').disabled = true;
}

document.getElementById('btn-arduino-connect').onclick = async () => {
  if (!('serial' in navigator)) return;
  try {
    serialPort = await navigator.serial.requestPort();
    await serialPort.open({ baudRate: 9600 });
    document.getElementById('arduino-status').textContent = '接続しました。ボタンが押されるのを待っています…';
    readSerialLoop();
  } catch (e) {
    document.getElementById('arduino-status').textContent = '接続失敗: ' + e.message;
  }
};

document.getElementById('btn-arduino-disconnect').onclick = async () => {
  try { if (serialReader) await serialReader.cancel(); } catch (e) {}
  try { if (serialPort) await serialPort.close(); } catch (e) {}
  serialPort = null;
  serialReader = null;
  document.getElementById('arduino-status').textContent = '切断しました';
};

async function readSerialLoop() {
  const textDecoder = new TextDecoderStream();
  serialPort.readable.pipeTo(textDecoder.writable);
  const reader = textDecoder.readable.getReader();
  serialReader = reader;
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (!value) continue;
      serialLineBuffer += value;
      let idx;
      while ((idx = serialLineBuffer.indexOf('\n')) >= 0) {
        const line = serialLineBuffer.slice(0, idx).trim();
        serialLineBuffer = serialLineBuffer.slice(idx + 1);
        handleSerialLine(line);
      }
    }
  } catch (e) {
    document.getElementById('arduino-status').textContent = '読み取りエラー: ' + e.message;
  } finally {
    reader.releaseLock();
  }
}

function handleSerialLine(line) {
  if (!line) return;

  // 既知の機種のフォーマットはそのまま高速パスで処理する（学習不要）
  const knownBuzzerId = parseBuzzerIdFromLine(line);
  if (knownBuzzerId !== null) {
    socket.emit('client_buzz', { buzzerId: knownBuzzerId });
    document.getElementById('arduino-status').textContent = `#${knownBuzzerId} を受信 (${new Date().toLocaleTimeString()})`;
    return;
  }

  // 未知の形式は、サーバー側の対応表(buzzerSignalMap)・学習モードにそのまま委ねる
  // （学習モード中ならサーバーが登録し、対応表にあれば自動でrecordBuzzされる）
  socket.emit('client_raw_signal', { signal: line });
  document.getElementById('arduino-status').textContent = `信号を受信: ${line}`;
}

// 対応フォーマット:
//  1) RP2040マイコンボードキット早押し機(10~12端子早押し機)形式:
//     "ButtonRank<着順>:<ボタン番号>" 例: "ButtonRank1:3" → 3番のボタンが1着
//  2) 自作の簡易早押し機形式: "BUZZ,<ボタン番号>" 例: "BUZZ,3"
// どちらの形式が届いても自動判別して処理します。
// これらに当てはまらない機種は、下の「ボタンの割り当て」機能で学習させてください。
function parseBuzzerIdFromLine(line) {
  let m = line.match(/ButtonRank\d+:(\d+)/i);
  if (m) return Number(m[1]);
  m = line.match(/BUZZ,(\d+)/i);
  if (m) return Number(m[1]);
  return null;
}

// --- ボタンの割り当て（機種を問わない汎用の学習機能） ---
// 対応表(buzzerSignalMap)・学習モードの状態はサーバー側で管理されており、
// room_state に載って全クライアントに配信される。ここでは表示と操作だけを行う。
// 割り当ては「席番号」ではなく「参加者(playerId)」に対して直接行う。
socket.on('signal_learned', ({ signal, playerName }) => {
  document.getElementById('learn-status').textContent = `「${signal}」を ${playerName || '(不明)'} さんに割り当てました`;
});
socket.on('unmapped_signal', ({ signal }) => {
  document.getElementById('unmapped-signal-status').textContent =
    `未割り当ての信号を受信しました: 「${signal}」（下の「学習開始」でこの信号を割り当てできます）`;
});

// 参加者の入退室に応じて選択肢を更新する（選択中の値はできるだけ保持する）
function renderLearnPlayerSelect(players) {
  const select = document.getElementById('learn-player-select');
  const prevValue = select.value;
  const list = players || [];
  if (!list.length) {
    select.innerHTML = '<option value="">(参加者がいません)</option>';
    return;
  }
  select.innerHTML = list.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  if (list.some((p) => p.id === prevValue)) select.value = prevValue;
}

function renderSignalMapList(buzzerSignalMap, players) {
  const list = document.getElementById('signal-map-list');
  const entries = buzzerSignalMap || [];
  if (!entries.length) {
    list.innerHTML = '<div class="hint">まだ何も割り当てられていません</div>';
    return;
  }
  const nameById = new Map((players || []).map((p) => [p.id, p.name]));
  list.innerHTML = '';
  entries.forEach(({ signal, playerId }) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; gap:.6em; padding:.4em .2em; border-top:1px solid var(--line);';
    const name = nameById.get(playerId) || '(退室済み)';
    row.innerHTML = `
      <span style="flex:1; font-family:monospace; word-break:break-all;">${escapeHtml(signal)}</span>
      <span style="color:var(--gold); font-weight:900;">→ ${escapeHtml(name)}</span>
    `;
    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.textContent = '削除';
    delBtn.style.cssText = 'padding:.3em .7em; font-size:.8rem;';
    delBtn.onclick = () => socket.emit('remove_signal_mapping', { signal });
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

function renderLearnStatus(pendingLearnTarget, players) {
  const startBtn = document.getElementById('btn-start-learn');
  const cancelBtn = document.getElementById('btn-cancel-learn');
  if (pendingLearnTarget) {
    const name = ((players || []).find((p) => p.id === pendingLearnTarget) || {}).name || '(不明)';
    startBtn.disabled = true;
    cancelBtn.style.display = 'inline-block';
    document.getElementById('learn-status').textContent = `${name} さんに登録します。実物のボタンを押してください…`;
  } else {
    startBtn.disabled = false;
    cancelBtn.style.display = 'none';
  }
}

document.getElementById('btn-start-learn').onclick = () => {
  const playerId = document.getElementById('learn-player-select').value;
  if (!playerId) { alert('参加者を選択してください'); return; }
  socket.emit('start_learn_signal', { playerId });
};
document.getElementById('btn-cancel-learn').onclick = () => {
  socket.emit('cancel_learn_signal');
  document.getElementById('learn-status').textContent = '学習をキャンセルしました';
};
</script>
</body>
</html>
