<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>回答者 | 早押し・ボードクイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand" id="player-name-tag">回答者</div>
  <div style="display:flex; align-items:center; gap:.8em;">
    <button class="secondary" id="btn-open-buzzer" style="padding:.4em .8em; font-size:.85rem;">⚡ 早押しボタン</button>
    <button class="secondary" id="btn-open-history" style="padding:.4em .8em; font-size:.85rem;">📜 問題履歴</button>
    <button class="secondary" id="btn-open-scoreboard" style="padding:.4em .8em; font-size:.85rem;">
      🏆 スコア <span id="my-score" style="font-weight:900; color:var(--gold);">0点</span>
    </button>
    <div class="room-tag" id="room-tag">-</div>
  </div>
</div>

<div id="buzzer-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-card" style="text-align:center;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.8em;">
      <h3 style="margin:0;">早押しボタン</h3>
      <button class="secondary" id="btn-close-buzzer" style="padding:.3em .8em;">閉じる</button>
    </div>
    <p class="hint">実物の早押し機が無くても、この画面から早押しに参加できます。
      ボタンをタップするか、下で設定したキーボードのキーを押してください。</p>

    <div class="virtual-buzzer-wrap" id="btn-virtual-buzz">
      <div class="virtual-buzzer-dome">
        <div class="virtual-buzzer-dome-highlight"></div>
        <span class="virtual-buzzer-label">押す</span>
      </div>
      <div class="virtual-buzzer-base"></div>
    </div>

    <div id="buzzer-result-status" class="hint" style="min-height:1.4em; margin:.4em 0 1em;"></div>

    <div style="border-top:1px solid var(--line); padding-top:.8em;">
      <div class="hint">キーボードでも押せます（タブレットに外付けキーボードを
        繋いでいる場合や、パソコンで参加している場合に便利です）</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:.6em; margin-top:.6em;">
        <span>現在のキー: <strong id="buzzer-key-label" style="color:var(--gold);">Enter</strong></span>
        <button class="secondary" id="btn-change-buzzer-key" style="padding:.3em .8em; font-size:.85rem;">変更する</button>
      </div>
    </div>
  </div>
</div>

<div id="scoreboard-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.8em;">
      <h3 style="margin:0;">現在のスコア状況</h3>
      <button class="secondary" id="btn-close-scoreboard" style="padding:.3em .8em;">閉じる</button>
    </div>
    <div id="scoreboard-list"></div>
  </div>
</div>

<div id="history-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.8em;">
      <h3 style="margin:0;">これまでの問題</h3>
      <button class="secondary" id="btn-close-history" style="padding:.3em .8em;">閉じる</button>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<div class="wrap" style="padding:.7em 1em 1em; display:flex; flex-direction:column;">
  <div id="error-area"></div>

  <div id="board-area" style="display:none; flex-direction:column; flex:1; min-height:0;">
    <div class="card" style="margin-bottom:.6em; flex-shrink:0;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.6em;">
        <div id="phase-label" class="hint">出題を待っています…</div>
        <div id="timer-display" style="font-size:1.4rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--gold);"></div>
        <div style="display:flex; gap:.5em;">
          <button class="secondary" id="btn-clear">全部消す</button>
          <button class="gold" id="btn-submit">回答を確定する</button>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:.5em; flex-wrap:wrap; margin-top:.6em; padding-top:.6em; border-top:1px solid var(--line);">
        <div id="pen-color-swatches" style="display:flex; gap:.35em;"></div>
        <input type="color" id="pen-color-custom" value="#111111" title="色をカスタム選択" style="width:2.2em; height:2.2em; padding:0; border:2px solid var(--line); border-radius:8px; background:none; cursor:pointer;">
        <button class="secondary" id="btn-eraser" style="padding:.4em .8em; font-size:.85rem;">🧹 消しゴム</button>
        <span style="flex:1;"></span>
        <button class="secondary" id="btn-player-undo" disabled style="padding:.4em .8em; font-size:.85rem;">↩️ 元に戻す</button>
        <button class="secondary" id="btn-player-redo" disabled style="padding:.4em .8em; font-size:.85rem;">↪️ やり直す</button>
      </div>
    </div>

    <div class="canvas-wrap card" id="canvas-wrap" style="padding:0; flex:1; min-height:0;">
      <canvas id="board" width="1000" height="700"></canvas>
    </div>

    <div class="hint" id="submit-status" style="margin-top:.5em; flex-shrink:0;"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/timer-sync.js"></script>
<script src="js/question-text.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const roomName = params.get('room');
const password = params.get('password') || '';
const playerName = params.get('name');
const buzzerId = params.get('buzzerId') || '';

if (!roomName || !playerName) {
  document.getElementById('error-area').innerHTML = '<div class="error-msg">部屋情報が不足しています。ホームからやり直してください。</div>';
  throw new Error('missing params');
}

document.getElementById('player-name-tag').textContent = playerName;
document.getElementById('room-tag').textContent = roomName;

const socket = io();
const canvas = document.getElementById('board');
const canvasWrap = document.getElementById('canvas-wrap');
const ctx = canvas.getContext('2d');

let drawing = false;
let locked = false;

// --- ペンの色・消しゴム ---
const PEN_COLORS = ['#111111', '#e6484f', '#4cc9f0', '#45c98a', '#f2b705'];
const DEFAULT_LINE_WIDTH = 6;
const ERASER_LINE_WIDTH = 26;
let currentColor = PEN_COLORS[0];
let isEraser = false;

function activeColor() { return isEraser ? '#ffffff' : currentColor; }
function activeLineWidth() { return isEraser ? ERASER_LINE_WIDTH : DEFAULT_LINE_WIDTH; }

function renderPenToolbar() {
  const swatchWrap = document.getElementById('pen-color-swatches');
  swatchWrap.innerHTML = '';
  PEN_COLORS.forEach((color) => {
    const swatch = document.createElement('button');
    swatch.className = 'secondary';
    swatch.style.cssText = `width:2.2em; height:2.2em; padding:0; border-radius:8px; background:${color}; border:2px solid ${(!isEraser && color === currentColor) ? 'var(--gold)' : 'var(--line)'};`;
    swatch.onclick = () => {
      currentColor = color;
      isEraser = false;
      renderPenToolbar();
    };
    swatchWrap.appendChild(swatch);
  });
  document.getElementById('btn-eraser').style.outline = isEraser ? '2px solid var(--gold)' : 'none';
}

document.getElementById('pen-color-custom').addEventListener('input', (evt) => {
  currentColor = evt.target.value;
  isEraser = false;
  renderPenToolbar();
});
document.getElementById('btn-eraser').onclick = () => {
  isEraser = !isEraser;
  renderPenToolbar();
};
renderPenToolbar();

// --- 自分のボード専用のUndo/Redo（ストロークを描き始める前の状態を保存しておく） ---
let undoStack = [];
let redoStack = [];
const MAX_UNDO_STEPS = 30;

function updateUndoRedoButtons() {
  document.getElementById('btn-player-undo').disabled = !undoStack.length;
  document.getElementById('btn-player-redo').disabled = !redoStack.length;
}

function pushUndoSnapshot() {
  try {
    undoStack.push(canvas.toDataURL('image/png'));
    if (undoStack.length > MAX_UNDO_STEPS) undoStack.shift();
    redoStack = []; // 新しい書き込みをしたらredo履歴は破棄する
    updateUndoRedoButtons();
  } catch (e) { /* 保存できなくてもUndo以外の動作は継続する */ }
}

function restoreCanvasSnapshot(dataUrl) {
  const rect = canvas.getBoundingClientRect();
  const img = new Image();
  img.onload = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.drawImage(img, 0, 0, rect.width, rect.height);
  };
  img.src = dataUrl;
}

document.getElementById('btn-player-undo').onclick = () => {
  if (!undoStack.length) return;
  redoStack.push(canvas.toDataURL('image/png'));
  restoreCanvasSnapshot(undoStack.pop());
  updateUndoRedoButtons();
};
document.getElementById('btn-player-redo').onclick = () => {
  if (!redoStack.length) return;
  undoStack.push(canvas.toDataURL('image/png'));
  restoreCanvasSnapshot(redoStack.pop());
  updateUndoRedoButtons();
};

// タブレットの画面サイズ・向きに合わせて、ボードの「見えている領域」いっぱいに
// 描画できるようにする。
// 以前は縦横比(1000:700)を保ったまま表示サイズだけ縮小していたため、画面の
// 比率によっては実際に描画できる<canvas>より外側に余白ができてしまい、
// そこが「白いのに描けない」死角になっていた。
// この修正では、表示サイズに合わせて内部の描画解像度そのものを更新するため、
// 見えている白い部分＝そのまま描画できる部分になり、死角が発生しない。
function fitCanvasToViewport() {
  const rect = canvasWrap.getBoundingClientRect();
  const cssWidth = Math.max(80, Math.floor(rect.width));
  const cssHeight = Math.max(80, Math.floor(window.innerHeight - rect.top - 12)); // 下端に少し余白
  const dpr = window.devicePixelRatio || 1;

  // リサイズ（画面回転など）で今までの描画内容が消えないよう、事前に画像として保存
  let prevDataUrl = null;
  if (canvas.width > 0 && canvas.height > 0) {
    try { prevDataUrl = canvas.toDataURL('image/png'); } catch (e) {}
  }

  canvas.style.width = `${cssWidth}px`;
  canvas.style.height = `${cssHeight}px`;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);

  // 以降の描画命令はCSSピクセル単位（見た目どおりのサイズ）で指定できるようにする
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cssWidth, cssHeight);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (prevDataUrl) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, cssWidth, cssHeight);
    img.src = prevDataUrl;
  }
}

window.addEventListener('resize', fitCanvasToViewport);
window.addEventListener('orientationchange', () => setTimeout(fitCanvasToViewport, 250));
window.addEventListener('load', fitCanvasToViewport);

function normPoint(evt) {
  const rect = canvas.getBoundingClientRect();
  const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
  const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
  // x, y: CSSピクセル単位のローカル描画座標（ctxがdprでスケール済みのためそのまま使える）
  // fx, fy: 他端末へ送る0〜1の正規化座標（表示サイズが端末ごとに異なっても揃うようにする）
  return {
    x: cx,
    y: cy,
    fx: rect.width ? cx / rect.width : 0,
    fy: rect.height ? cy / rect.height : 0
  };
}

function startDraw(evt) {
  if (locked) return;
  pushUndoSnapshot(); // 描き始める前の状態を保存しておく（Undoで戻れるようにする）
  drawing = true;
  const p = normPoint(evt);
  ctx.strokeStyle = activeColor();
  ctx.lineWidth = activeLineWidth();
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  socket.emit('draw_stroke', { phase: 'start', x: p.fx, y: p.fy, color: activeColor(), lineWidth: activeLineWidth() });
  evt.preventDefault();
}
function moveDraw(evt) {
  if (!drawing || locked) return;
  const p = normPoint(evt);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  socket.emit('draw_stroke', { phase: 'move', x: p.fx, y: p.fy });
  evt.preventDefault();
}
function endDraw(evt) {
  if (!drawing) return;
  drawing = false;
  socket.emit('draw_stroke', { phase: 'end' });
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', moveDraw, { passive: false });
canvas.addEventListener('touchend', endDraw);

function clearCanvas() {
  const rect = canvas.getBoundingClientRect();
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, rect.width, rect.height);
}

document.getElementById('btn-clear').onclick = () => {
  if (locked) return;
  pushUndoSnapshot(); // 全消去もUndoで戻せるようにしておく
  clearCanvas();
  socket.emit('clear_canvas');
};

document.getElementById('btn-submit').onclick = () => {
  const imageData = canvas.toDataURL('image/png');
  socket.emit('submit_answer', { imageData });
  document.getElementById('submit-status').textContent = '回答を送信しました。判定者の指示を待ってください。';
};

socket.on('connect', () => {
  socket.emit('join_room', {
    roomName, password, role: 'player', playerName,
    buzzerId: buzzerId !== '' ? buzzerId : undefined
  }, (res) => {
    if (res.error) {
      document.getElementById('error-area').innerHTML = `<div class="error-msg">${res.error}</div>`;
      return;
    }
    document.getElementById('board-area').style.display = 'flex';
    applyState(res.state);
    fitCanvasToViewport();
  });
});

socket.on('room_state', applyState);

function applyState(state) {
  if (!state) return;
  latestState = state;
  const label = document.getElementById('phase-label');
  const me = (state.players || []).find(p => p.id === socket.id);

  if (state.phase === 'idle') {
    locked = true;
    label.textContent = '出題を待っています…';
  } else {
    // 全体のロック状態ではなく、自分自身の locked フラグを見る
    // （判定者が個別にロック解除している場合はこちらが優先される）
    locked = me ? !!me.locked : (state.phase === 'locked');
    label.textContent = locked ? '回答はロックされています（判定者の指示を待ってください）' : '回答中… 制限時間内にボードに記入してください';
  }

  if (me) document.getElementById('my-score').textContent = `${me.score || 0}点`;

  renderScoreboard(state);
  renderTimer(state.timer);
  renderBuzzerResultStatus(state);

  // ラベルの文言変化（ロック表示・タイマー表示の有無など）でヘッダー行の高さが
  // 変わることがあるため、その都度キャンバスのサイズを再計算して画面内に収める
  requestAnimationFrame(fitCanvasToViewport);
}

function renderTimer(timer) {
  const el = document.getElementById('timer-display');
  if (!timer || !timer.endsAt) {
    TimerSync.stop();
    el.textContent = '';
    return;
  }
  TimerSync.start(timer.endsAt, (sec) => {
    el.textContent = TimerSync.format(sec);
  });
}

// --- スコア状況パネル ---
function renderScoreboard(state) {
  const list = document.getElementById('scoreboard-list');
  const sorted = [...(state.players || [])].sort((a, b) => (b.score || 0) - (a.score || 0));
  if (!sorted.length) {
    list.innerHTML = '<div class="hint">まだ参加者がいません</div>';
    return;
  }
  list.innerHTML = sorted.map((p, i) => `
    <div style="display:flex; align-items:center; gap:.7em; padding:.55em .2em; border-top:1px solid var(--line);">
      <div style="width:2em; text-align:center; font-weight:900; color:${i === 0 ? 'var(--gold)' : 'var(--text-muted)'};">${i + 1}</div>
      <div style="flex:1; font-weight:${p.id === socket.id ? '900' : '400'};">
        ${escapeHtml(p.name)}${p.id === socket.id ? '<span class="hint"> (あなた)</span>' : ''}
      </div>
      <div style="font-weight:900; color:var(--gold);">${p.score || 0}点</div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

document.getElementById('btn-open-scoreboard').onclick = () => {
  document.getElementById('scoreboard-overlay').style.display = 'flex';
};
document.getElementById('btn-close-scoreboard').onclick = () => {
  document.getElementById('scoreboard-overlay').style.display = 'none';
};

// --- 仮想早押しボタン（実機の早押し機が無い回答者向け） ---
// 自分自身のsocket接続からそのまま送るので、席番号やボタンの割り当て設定は不要。
// キーボードでの早押しにも対応し、使うキーは端末ごとに自由に設定できる（既定はEnter）。
let buzzerKey = localStorage.getItem(`buzzerKey:${roomName}`) || 'Enter';
let waitingForKeyBind = false;
document.getElementById('buzzer-key-label').textContent = buzzerKey;

function triggerVirtualBuzz() {
  socket.emit('player_buzz');
  const dome = document.querySelector('#btn-virtual-buzz .virtual-buzzer-dome');
  if (dome) {
    dome.style.transform = 'translateX(-50%) scale(.94)';
    setTimeout(() => { dome.style.transform = ''; }, 120);
  }
}

document.getElementById('btn-virtual-buzz').onclick = triggerVirtualBuzz;

document.getElementById('btn-open-buzzer').onclick = () => {
  document.getElementById('buzzer-overlay').style.display = 'flex';
  renderBuzzerResultStatus(latestState);
};
document.getElementById('btn-close-buzzer').onclick = () => {
  document.getElementById('buzzer-overlay').style.display = 'none';
};

document.getElementById('btn-change-buzzer-key').onclick = () => {
  waitingForKeyBind = true;
  document.getElementById('buzzer-key-label').textContent = '（キーを押してください…）';
};

// キー入力の監視はページ全体で常に有効にしておく（モーダルを閉じていても、
// 早押しの瞬間にすぐ反応できるようにするため）。
window.addEventListener('keydown', (evt) => {
  if (waitingForKeyBind) {
    waitingForKeyBind = false;
    buzzerKey = evt.key;
    localStorage.setItem(`buzzerKey:${roomName}`, buzzerKey);
    document.getElementById('buzzer-key-label').textContent = buzzerKey;
    evt.preventDefault();
    return;
  }
  if (evt.repeat) return; // 長押しの連続発火を無視
  if (evt.key === buzzerKey) {
    evt.preventDefault();
    triggerVirtualBuzz();
  }
});

// 早押し結果（自分が何着だったか）を表示する。
// 1着ならランプ（ドーム部分）を点滅させ、2着以降は1着との着差タイムを表示する
// （サーバー側のタイムスタンプを使うため、端末ごとの時計のズレの影響を受けない）。
let latestState = null;
function renderBuzzerResultStatus(state) {
  const el = document.getElementById('buzzer-result-status');
  const dome = document.querySelector('#btn-virtual-buzz .virtual-buzzer-dome');
  if (!state) { el.textContent = ''; if (dome) dome.classList.remove('lit'); return; }

  const order = state.buzzOrder || [];
  const idx = order.findIndex((b) => b.playerId === socket.id);

  if (idx === -1) {
    el.textContent = state.buzzAccepting ? '早押し受付中です' : 'まだ早押しは始まっていません';
    if (dome) dome.classList.remove('lit');
    return;
  }

  if (idx === 0) {
    el.innerHTML = `⚡ <strong style="color:var(--gold);">1着でした！</strong>`;
    if (dome) dome.classList.add('lit');
  } else {
    if (dome) dome.classList.remove('lit');
    const diffSec = ((order[idx].ts - order[0].ts) / 1000).toFixed(2);
    el.innerHTML = `${idx + 1}着でした（1着との差 <strong style="color:var(--gold);">+${diffSec}秒</strong>）`;
  }
}

// --- 問題履歴パネル（判定者がSENDした問題を後から見返せる） ---
document.getElementById('btn-open-history').onclick = () => {
  document.getElementById('history-overlay').style.display = 'flex';
  socket.emit('get_question_history', (res) => {
    renderHistoryList((res && res.history) || []);
  });
};
document.getElementById('btn-close-history').onclick = () => {
  document.getElementById('history-overlay').style.display = 'none';
};
socket.on('question_history_updated', () => {
  // モーダルを開いている間だけ更新する（閉じているのに裏で取得する必要は無い）
  if (document.getElementById('history-overlay').style.display === 'flex') {
    socket.emit('get_question_history', (res) => {
      renderHistoryList((res && res.history) || []);
    });
  }
});

// 問題履歴の1件に記録された正誤結果(results)を「正解者/不正解者」のリストとして表示する
function renderHistoryResultsHTML(results, escapeHtmlFn) {
  if (!results || !results.length) return '';
  const correctNames = results.filter((r) => r.correct).map((r) => escapeHtmlFn(r.name));
  const incorrectNames = results.filter((r) => !r.correct).map((r) => escapeHtmlFn(r.name));
  const parts = [];
  if (correctNames.length) {
    parts.push(`<div style="color:var(--green);">○ 正解: ${correctNames.join('、')}</div>`);
  }
  if (incorrectNames.length) {
    parts.push(`<div style="color:var(--red);">× 不正解: ${incorrectNames.join('、')}</div>`);
  }
  return `<div style="margin-top:.5em; font-size:.85rem;">${parts.join('')}</div>`;
}

function renderHistoryList(history) {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<div class="hint">まだ問題は表示されていません</div>';
    return;
  }
  list.innerHTML = [...history].reverse().map((h) => `
    <div class="card" style="margin-bottom:.6em; padding:.7em;">
      <div class="hint">No. ${escapeHtml(h.no || '')}</div>
      <div style="margin:.3em 0;">${renderSplitQuestionHTML(h.question || '', escapeHtml)}</div>
      <div style="color:var(--gold); font-weight:700;">解答: ${escapeHtml(h.answer || '')}</div>
      ${h.comment ? `<div class="hint">${escapeHtml(h.comment)}</div>` : ''}
      ${h.author ? `<div class="hint">出題: ${escapeHtml(h.author)}</div>` : ''}
      ${renderHistoryResultsHTML(h.results, escapeHtml)}
    </div>
  `).join('');
}

socket.on('reset_canvases', () => {
  clearCanvas();
  locked = false;
  document.getElementById('submit-status').textContent = '';
  undoStack = [];
  redoStack = [];
  updateUndoRedoButtons();
});
</script>
</body>
</html>
